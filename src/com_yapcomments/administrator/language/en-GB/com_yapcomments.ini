; Permissions
COM_YAPCOMMENTS_ACTION_VIEW="View comments"
COM_YAPCOMMENTS_ACTION_VIEW_DESC="Allows users in the group to see comment threads."
COM_YAPCOMMENTS_ACTION_POST="Write comments"
COM_YAPCOMMENTS_ACTION_POST_DESC="Allows users in the group to write new comments. Allowed for the Guest group by default, so visitors can comment with just a name - set it to Denied to require login."
COM_YAPCOMMENTS_ACTION_REPLY="Reply to comments"
COM_YAPCOMMENTS_ACTION_REPLY_DESC="Allows users in the group to reply to existing comments."
COM_YAPCOMMENTS_ACTION_AUTOAPPROVE="Auto publish comment"
COM_YAPCOMMENTS_ACTION_AUTOAPPROVE_DESC="Comments from users in the group are published immediately. When not allowed, they wait for a moderator to approve them. Allow it for the Guest group to publish guest comments instantly."
COM_YAPCOMMENTS_ACTION_VOTE="Like & dislike"
COM_YAPCOMMENTS_ACTION_VOTE_DESC="Allows users in the group to like and dislike comments."
COM_YAPCOMMENTS_ACTION_MARKDOWN="Use Markdown"
COM_YAPCOMMENTS_ACTION_MARKDOWN_DESC="Allows bold, italic, quotes, lists, spoilers and other Markdown formatting. Without it comments are shown as plain text."
COM_YAPCOMMENTS_ACTION_LINKS="Post links"
COM_YAPCOMMENTS_ACTION_LINKS_DESC="Links posted by users in the group become clickable. Without it, addresses are shown as plain text."
COM_YAPCOMMENTS_ACTION_IMAGES="Embed images"
COM_YAPCOMMENTS_ACTION_IMAGES_DESC="Allows embedding HTTPS images with Markdown image syntax. Requires Use Markdown."
COM_YAPCOMMENTS_ACTION_CODE="Post code"
COM_YAPCOMMENTS_ACTION_CODE_DESC="Allows inline code and fenced code blocks. Requires Use Markdown."
COM_YAPCOMMENTS_ACTION_EDIT_OWN="Edit own comments"
COM_YAPCOMMENTS_ACTION_EDIT_OWN_DESC="Allows users to edit their own comments within the configured edit window."
COM_YAPCOMMENTS_ACTION_DELETE_OWN="Delete own comments"
COM_YAPCOMMENTS_ACTION_DELETE_OWN_DESC="Allows users to delete their own comments. Comments with replies are blanked to keep the thread."
COM_YAPCOMMENTS_ACTION_MODERATE="Moderate on the site"
COM_YAPCOMMENTS_ACTION_MODERATE_DESC="Allows approving, pinning, editing, marking as spam and deleting any comment directly on the site."
COM_YAPCOMMENTS_ACTION_BYPASS="Bypass limits"
COM_YAPCOMMENTS_ACTION_BYPASS_DESC="Users in the group are not subject to flood, hourly, link count and minimum fill time limits."

