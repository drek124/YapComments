<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">YapComments</title>

  <defs>
    <radialGradient id="bg" cx="0%" cy="0%" r="140%">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".35" stop-color="#6366f1"/>
      <stop offset=".72" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="440" cy="470" r="150" fill="#fff" fill-opacity=".08" clip-path="url(#tile)"/>

  <!-- Back bubble (reply) -->
  <path d="M232 132h152a48 48 0 0 1 48 48v84a48 48 0 0 1-48 48h-6v38l-48-38h-98a48 48 0 0 1-48-48v-84a48 48 0 0 1 48-48z"
        fill="#fff" fill-opacity=".35"/>

  <!-- Front bubble -->
  <g filter="url(#shadow)">
    <path d="M128 184h184a52 52 0 0 1 52 52v96a52 52 0 0 1-52 52H192l-62 50v-50a52 52 0 0 1-54-52v-96a52 52 0 0 1 52-52z"
          fill="#fff"/>
  </g>

  <!-- "Yap" dots -->
  <circle cx="160" cy="284" r="22" fill="url(#dot)"/>
  <circle cx="226" cy="284" r="22" fill="url(#dot)"/>
  <circle cx="292" cy="284" r="22" fill="url(#dot)"/>
</svg>
