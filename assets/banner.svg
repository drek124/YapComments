<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">YapComments</title>
  <desc id="d">The ultimate Joomla! comments component, by drek124.</desc>

  <defs>
    <radialGradient id="bg" cx="0%" cy="0%" r="140%">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".35" stop-color="#6366f1"/>
      <stop offset=".72" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </radialGradient>
    <linearGradient id="av1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="av2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="av3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <symbol id="i-like" viewBox="0 0 24 24">
      <path d="M7 10v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 18.4 21H7V10l4.5-7.4a1.9 1.9 0 0 1 3.5 1.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-dislike" viewBox="0 0 24 24">
      <path d="M17 14V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 18.1 10 14H4.2a2 2 0 0 1-2-2.3l1.4-7A2 2 0 0 1 5.6 3H17v11l-4.5 7.4a1.9 1.9 0 0 1-3.5-1.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-reply" viewBox="0 0 24 24">
      <path d="M9 17 4 12l5-5M20 18v-2a4 4 0 0 0-4-4H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4z M22 2 11 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .float-a { animation: float 6s ease-in-out infinite; }
    .float-b { animation: float 6s ease-in-out -2s infinite; }
    .float-c { animation: float 7s ease-in-out -4s infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 3.2s cubic-bezier(.34,1.56,.64,1) infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3.2s ease-out infinite; }
    .count-old { animation: roll-out 3.2s ease infinite; }
    .count-new { animation: roll-in 3.2s ease infinite; }
    .toast { animation: toast 6.4s cubic-bezier(.34,1.56,.64,1) infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .glow { animation: glow 5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pop { 0%, 8% { transform: scale(1); } 16% { transform: scale(1.45) rotate(-12deg); } 26% { transform: scale(.9); } 34%, 100% { transform: scale(1); } }
    @keyframes ring { 0%, 8% { opacity: 0; transform: scale(.3); } 12% { opacity: .8; } 40%, 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes roll-out { 0%, 10% { opacity: 1; transform: translateY(0); } 18%, 92% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes roll-in { 0%, 10% { opacity: 0; transform: translateY(-10px); } 18%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes toast { 0%, 12% { opacity: 0; transform: translateY(24px); } 20%, 80% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; transform: translateY(12px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .6; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .count-old, .toast { opacity: 1; }
      .count-new { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <circle class="glow" cx="1040" cy="60" r="220" fill="#fff" fill-opacity=".18"/>
    <circle cx="140" cy="440" r="200" fill="#1e1b4b" fill-opacity=".18"/>

    <!-- Brand -->
    <g transform="translate(72 92)">
      <rect width="64" height="64" rx="18" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".45"/>
      <use href="#i-chat" x="16" y="16" width="32" height="32" color="#fff"/>
      <text x="0" y="132" fill="#fff" font-size="68" font-weight="800" letter-spacing="-2">YapComments</text>
      <text x="2" y="176" fill="#fff" fill-opacity=".9" font-size="22" font-weight="500">The ultimate Joomla! comments component</text>

      <g transform="translate(0 206)" font-size="15" font-weight="600" fill="#fff">
        <rect width="138" height="34" rx="17" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".35"/>
        <text x="69" y="22" text-anchor="middle">Likes &amp; dislikes</text>
        <rect x="148" width="104" height="34" rx="17" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".35"/>
        <text x="200" y="22" text-anchor="middle">Markdown</text>
        <rect x="262" width="118" height="34" rx="17" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".35"/>
        <text x="321" y="22" text-anchor="middle">Permissions</text>
        <rect x="390" width="64" height="34" rx="17" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".35"/>
        <text x="422" y="22" text-anchor="middle">SEO</text>
        <rect x="464" width="114" height="34" rx="17" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".35"/>
        <text x="521" y="22" text-anchor="middle">EN · العربية</text>
      </g>
      <text x="2" y="282" fill="#fff" fill-opacity=".75" font-size="15" font-weight="500">by drek124</text>
    </g>

    <!-- Comment 1 -->
    <g class="float-a">
      <g transform="translate(726 44)" filter="url(#shadow)">
        <rect width="480" height="150" rx="20" fill="#fff"/>
        <circle cx="42" cy="42" r="20" fill="url(#av1)"/>
        <text x="42" y="48" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">SG</text>
        <text x="76" y="40" fill="#0f172a" font-size="16" font-weight="700">Sara</text>
        <rect x="118" y="26" width="50" height="19" rx="6" fill="#eef0f7"/>
        <text x="143" y="40" fill="#64748b" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".5">GUEST</text>
        <text x="178" y="40" fill="#94a3b8" font-size="14">· just now</text>
        <text x="76" y="72" fill="#1e293b" font-size="16">Loving how <tspan fill="#94a3b8">**</tspan><tspan font-weight="700">smooth</tspan><tspan fill="#94a3b8">**</tspan> this feels!</text>
        <text x="76" y="96" fill="#1e293b" font-size="16">Comments, replies and votes in one place.</text>

        <!-- Like button with pop -->
        <g transform="translate(76 112)">
          <rect width="148" height="28" rx="14" fill="#f6f7fb"/>
          <rect x="2" y="2" width="70" height="24" rx="12" fill="#10b981" fill-opacity=".14"/>
          <circle class="ring" cx="22" cy="14" r="14" opacity="0" fill="none" stroke="#10b981" stroke-width="2"/>
          <g class="pop" color="#10b981">
            <use href="#i-like" x="12" y="5" width="18" height="18"/>
          </g>
          <g font-size="14" font-weight="700" fill="#10b981">
            <text class="count-old" x="36" y="19">23</text>
            <text class="count-new" x="36" y="19">24</text>
          </g>
          <use href="#i-dislike" x="86" y="5" width="18" height="18" color="#94a3b8"/>
          <text x="110" y="19" fill="#94a3b8" font-size="14" font-weight="700">1</text>
        </g>
        <g transform="translate(240 112)" fill="#64748b" color="#64748b" font-size="13" font-weight="600">
          <use href="#i-reply" x="0" y="5" width="16" height="16"/>
          <text x="22" y="19">Reply</text>
        </g>
      </g>
    </g>

    <!-- Comment 2 (reply) -->
    <g class="float-b">
      <g transform="translate(786 214)" filter="url(#shadow)">
        <rect width="420" height="104" rx="18" fill="#fff"/>
        <rect x="0" y="0" width="4" height="104" rx="2" fill="#6366f1"/>
        <circle cx="38" cy="36" r="17" fill="url(#av2)"/>
        <text x="38" y="41" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">D</text>
        <text x="66" y="35" fill="#0f172a" font-size="15" font-weight="700">drek124</text>
        <rect x="134" y="21" width="62" height="19" rx="6" fill="#6366f1"/>
        <text x="165" y="35" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".5">AUTHOR</text>
        <text x="206" y="35" fill="#94a3b8" font-size="13">· 2 min ago</text>
        <text x="66" y="64" fill="#1e293b" font-size="15">Thanks! It's <tspan font-style="italic">fully</tspan> RTL-ready too.</text>
        <g transform="translate(66 76)">
          <rect width="96" height="24" rx="12" fill="#f6f7fb"/>
          <use href="#i-like" x="10" y="4" width="16" height="16" color="#94a3b8"/>
          <text x="32" y="17" fill="#94a3b8" font-size="13" font-weight="700">12</text>
          <use href="#i-dislike" x="56" y="4" width="16" height="16" color="#94a3b8"/>
          <text x="78" y="17" fill="#94a3b8" font-size="13" font-weight="700">0</text>
        </g>
      </g>
    </g>

    <!-- Composer -->
    <g class="float-c">
      <g transform="translate(726 336)" filter="url(#shadow)">
        <rect width="300" height="52" rx="16" fill="#fff"/>
        <circle cx="28" cy="26" r="14" fill="url(#av3)"/>
        <text x="28" y="31" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">A</text>
        <text x="59" y="31" fill="#94a3b8" font-size="14">Join the discussion…</text>
        <rect class="caret" x="52" y="16" width="2" height="20" rx="1" fill="#6366f1"/>
        <rect x="222" y="11" width="66" height="30" rx="10" fill="url(#btn)"/>
        <text x="245" y="31" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Post</text>
        <use href="#i-send" x="263" y="18" width="14" height="14" color="#fff"/>
      </g>
    </g>

    <!-- Toast -->
    <g class="toast">
      <g transform="translate(1046 346)">
        <rect width="200" height="40" rx="12" fill="#111827" fill-opacity=".92"/>
        <circle cx="20" cy="20" r="5" fill="#10b981"/>
        <text x="34" y="25" fill="#fff" font-size="13" font-weight="600">Your comment is live!</text>
      </g>
    </g>
  </g>
</svg>
